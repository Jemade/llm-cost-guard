name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Cache tiktoken encodings
        run: |
          mkdir -p .cache/tiktoken
          TIKTOKEN_CACHE_DIR=$(pwd)/.cache/tiktoken python -c "import tiktoken; tiktoken.get_encoding('cl100k_base'); tiktoken.get_encoding('o200k_base')"

      - name: Run linter (ruff)
        run: |
          ruff check .

      - name: Run type checker (mypy)
        run: |
          mypy app

      - name: Run tests (pytest)
        env:
          TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
        run: |
          pytest -v --tb=short
