# LLM Pricing Catalog
# Cost per 1,000,000 tokens (USD)
# Prices are verified against official provider documentation.
# Note: Token pricing changes periodically. Always verify effective_date and last_verified.

version: "1.0.0"
currency: "USD"

models:
  # ---------------------------------------------------------------------------
  # OpenAI Models
  # Official source: https://openai.com/api/pricing/
  # Tokenizer: tiktoken (o200k_base for GPT-4o / o-series, cl100k_base for GPT-4 / 3.5)
  # ---------------------------------------------------------------------------
  - provider: "openai"
    model: "gpt-4o"
    display_name: "OpenAI GPT-4o"
    tokenizer_type: "tiktoken"
    encoding_name: "o200k_base"
    input_cost_per_1m_tokens: 2.50
    output_cost_per_1m_tokens: 10.00
    currency: "USD"
    effective_date: "2024-08-06"
    last_verified: "2025-01-15"
    notes: "Flagship multimodal model with 128k context window."

  - provider: "openai"
