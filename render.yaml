services:
  - type: web
    name: llm-cost-guard
    env: python
    buildCommand: pip install -r requirements.txt && python -c "import tiktoken; tiktoken.get_encoding('cl100k_base'); tiktoken.get_encoding('o200k_base')" && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: LLM Cost Guard
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: costguard-db
          property: connectionString
      - key: PRICING_FILE_PATH
        value: config/pricing.yaml
      - key: DEFAULT_DAILY_BUDGET
        value: "10.0"
      - key: DEFAULT_WEEKLY_BUDGET
        value: "50.0"
      - key: DEFAULT_MONTHLY_BUDGET
        value: "200.0"

databases:
  - name: costguard-db
    databaseName: costguard
    user: costguard_user
    plan: free
